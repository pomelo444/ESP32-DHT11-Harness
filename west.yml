manifest:
  version: "0.13"
  projects:
    - name: zephyr
      url: https://github.com/zephyrproject-rtos/zephyr
      revision: v4.4.2
      # Resolve Zephyr's pinned module manifest after fetching this project.
      import: true
  self:
    # Default for west init -m; west init -l records the actual checkout path.
    path: app
